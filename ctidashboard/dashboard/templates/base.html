{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}CTI Dashboard{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome for Icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- Plotly (for DNS Graph & Charts) -->
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

  <!-- Custom Styles -->
  <link href="{% static 'ioc_app/css/styles.css' %}" rel="stylesheet">

  <!-- Favicon or Page Icon -->
  <link rel="icon" href="https://img.icons8.com/color/48/hacker.png" type="image/png">

  {% block extra_head %}{% endblock %}
</head>

<body style="background-color: #0a192f; color: #e0f7fa; font-family: 'Segoe UI', sans-serif;">

  <!-- Optional Top Navigation or Header could go here -->

  <!-- Page Content -->
  {% block content %}
  <!-- Default fallback content -->
  <div class="container mt-5">
    <div class="alert alert-info text-center">
      🚀 Welcome to the Cyber Threat Intelligence Dashboard
    </div>
  </div>
  {% endblock %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Optional JS for dynamic components -->
  {% block extra_js %}{% endblock %}
</body>
</html>
