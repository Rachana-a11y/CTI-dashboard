{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="https://cdn.plot.ly/plotly-latest.min.css">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
  .charts-container {
    max-width: 1140px;
    margin: 60px auto;
    padding: 30px;
    background: rgba(5, 25, 35, 0.85);
    border-radius: 20px;
    box-shadow: 0 0 60px rgba(0, 229, 255, 0.15);
    color: #e0f7fa;
    animation: slideFade 1s ease;
  }

  .charts-container h2 {
    font-weight: 700;
    color: #00ffff;
    text-align: center;
    margin-bottom: 40px;
    text-shadow: 0 0 15px #00ffff70;
  }

  .chart-box {
    background-color: #0f1f2e;
    padding: 20px;
    margin-bottom: 40px;
    border-radius: 14px;
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.07);
  }

  @keyframes slideFade {
    from {
      opacity: 0;
      transform: translateY(40px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<div class="charts-container">
  <h2><i class="fas fa-chart-line"></i> Threat Intelligence Visuals</h2>

  {% if chart_data %}
    <div class="chart-box">
      <h5 class="text-info mb-3">IOC Category Distribution</h5>
      <div id="ioc-category-chart"></div>
    </div>

    <div class="chart-box">
      <h5 class="text-info mb-3">Malicious Score Trends</h5>
      <div id="malicious-score-chart"></div>
    </div>

    <div class="chart-box">
      <h5 class="text-info mb-3">Source Stats</h5>
      <div id="source-stats-chart"></div>
    </div>

    <script>
      const chartData = {{ chart_data|safe }};
      Plotly.newPlot('ioc-category-chart', chartData.category.data, chartData.category.layout, {responsive: true});
      Plotly.newPlot('malicious-score-chart', chartData.score.data, chartData.score.layout, {responsive: true});
      Plotly.newPlot('source-stats-chart', chartData.source.data, chartData.source.layout, {responsive: true});
    </script>
  {% else %}
    <div class="alert alert-warning text-center mt-5">
      ⚠️ No chart data available. Please analyze some IOCs to populate visuals.
    </div>
  {% endif %}
</div>
{% endblock %}
