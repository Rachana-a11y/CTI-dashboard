{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
  .input-section {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 75vh;
    background: linear-gradient(145deg, #0a192f, #1c1c1c);
    animation: fadeIn 1s ease;
  }

  .input-box {
    background: rgba(0, 20, 40, 0.95);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(0, 255, 255, 0.2);
    max-width: 600px;
    width: 100%;
  }

  
  .input-box h2 {
    color: #00ffff;
    text-align: center;
    margin-bottom: 30px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
  }

  .form-control {
    background-color: #1e293b;
    border: 1px solid #00bcd4;
    color: #e0f7fa;
  }

  .form-control::placeholder {
    color: #90caf9;
  }

  .btn-glow {
    background: #00e5ff;
    color: #000;
    border: none;
    font-weight: bold;
    width: 100%;
    transition: all 0.3s ease;
    box-shadow: 0 0 12px #00e5ff;
  }

  .btn-glow:hover {
    background: #00bcd4;
    box-shadow: 0 0 25px #00e5ff;
  }

  .error-message {
    color: #ff6b6b;
    text-align: center;
    margin-bottom: 15px;
    font-weight: bold;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(40px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>

<section class="input-section">
  <div class="input-box">
    <h2>🔍 Enter an IOC for Threat Analysis</h2>

    {% if error %}
      <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'ioc_input' %}">
      {% csrf_token %}
      <div class="mb-4">
        <input type="text" name="ioc" class="form-control form-control-lg"
               placeholder="e.g., 8.8.8.8, google.com, or file hash (MD5/SHA256)" required>
      </div>
      <button type="submit" class="btn btn-glow btn-lg">Analyze IOC</button>
    </form>
  </div>
</section>
{% endblock %}
